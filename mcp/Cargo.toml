[package]
name = "sameboy-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rust-mcp-sdk = { version = "1.0", default-features = false, features = ["server", "stdio", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
